# Codemagic — Ringtone Maker
# Upload TestFlight : clé API dans Team settings → Integrations (codemagic-ios-release-v2)

workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: codemagic-ios-release-v2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctre2.ringtonemaker
      vars:
        PRIVACY_POLICY_URL: https://chafik83606.github.io/ringtone/privacy.html
        APP_STORE_APPLE_ID: 6779209432
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificates
        script: keychain add-certificates
      - name: Apply profiles to Xcode project
        script: xcode-project use-profiles
      - name: Get packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build IPA
        script: |
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "=== iOS build number (pubspec): $BUILD_NUM ==="
          flutter build ipa --release \
            --build-number="$BUILD_NUM" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          find build -name "*.ipa" -type f
      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: no .ipa found after build"
            exit 1
          fi
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "0")
          echo "=== Upload build $BUILD_NUM (dernier sur TestFlight: $LATEST) ==="
          if [ "$BUILD_NUM" = "$LATEST" ]; then
            echo "ERROR: build $BUILD_NUM déjà sur TestFlight — incrémentez pubspec.yaml (+$((BUILD_NUM + 1))) et relancez."
            exit 1
          fi
          echo "Uploading $IPA_PATH (Apple ID $APP_STORE_APPLE_ID)..."
          set +e
          app-store-connect publish \
            --path "$IPA_PATH" \
            --apple-id "$APP_STORE_APPLE_ID" \
            --altool-retries 5 \
            --skip-package-validation 2>&1 | tee /tmp/asc_publish.log
          EXIT=$?
          set -e
          if grep -qE "UPLOAD SUCCEEDED|Successfully uploaded" /tmp/asc_publish.log; then
            echo "Upload livré à Apple — build $BUILD_NUM visible dans TestFlight sous 15-45 min."
            app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || true
            exit 0
          fi
          echo "=== Échec upload (exit $EXIT) — log complet : ==="
          cat /tmp/asc_publish.log
          exit 1
    artifacts:
      - build/**/*.ipa
    publishing:
      email:
        recipients:
          - contact@w-dynaweb.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Play Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        PRIVACY_POLICY_URL: https://chafik83606.github.io/ringtone/privacy.html
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
