# Codemagic — Ringtone Maker
# Dans Codemagic → ringtone → Settings → Environment variables,
# créez le groupe "ringtone_secrets" avec :
#   RC_IOS_API_KEY, ADMOB_APP_ID, ADMOB_BANNER_IOS, ADMOB_INTERSTITIAL_IOS
# (optionnel Android : RC_ANDROID_API_KEY, ADMOB_BANNER_ANDROID, ADMOB_INTERSTITIAL_ANDROID)
# Upload TestFlight : clé API déjà dans Team settings → Integrations (codemagic-ios-release-v2)

workflows:
  ios-release:
    name: iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Clé API App Store Connect (Team settings → Integrations → Developer Portal)
    integrations:
      app_store_connect: codemagic-ios-release-v2
    environment:
      # Utilise certificat + profil enregistrés dans Team settings → Code signing identities
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ctre2.ringtonemaker
      groups:
        - ringtone_secrets
      vars:
        RC_ENTITLEMENT_ID: pro
        RC_OFFERING_ID: default
        RC_MONTHLY_PRODUCT_ID: ringtone_pro_monthly
        RC_ANNUAL_PRODUCT_ID: ringtone_pro_annual
        RC_LIFETIME_PRODUCT_ID: ringtone_pro_lifetime
        PRIVACY_POLICY_URL: https://chafik83606.github.io/ringtone/privacy.html
        # App Store Connect → Sonnerie Maker Pro → Informations sur l'app
        APP_STORE_APPLE_ID: 6779209432
      flutter: stable
      xcode: latest
    scripts:
      - name: Set up keychain
        script: keychain initialize
      - name: Add certificates
        script: keychain add-certificates
      - name: Apply profiles to Xcode project
        script: xcode-project use-profiles
      - name: Inject AdMob App ID (iOS)
        script: |
          if [ -n "$ADMOB_APP_ID" ]; then
            sed -i '' "s|^ADMOB_APP_ID=.*|ADMOB_APP_ID=$ADMOB_APP_ID|" ios/Flutter/Release.xcconfig
          fi
      - name: Get packages
        script: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=RC_IOS_API_KEY=$RC_IOS_API_KEY \
            --dart-define=RC_ENTITLEMENT_ID=$RC_ENTITLEMENT_ID \
            --dart-define=RC_OFFERING_ID=$RC_OFFERING_ID \
            --dart-define=RC_MONTHLY_PRODUCT_ID=$RC_MONTHLY_PRODUCT_ID \
            --dart-define=RC_ANNUAL_PRODUCT_ID=$RC_ANNUAL_PRODUCT_ID \
            --dart-define=RC_LIFETIME_PRODUCT_ID=$RC_LIFETIME_PRODUCT_ID \
            --dart-define=ADMOB_BANNER_IOS=$ADMOB_BANNER_IOS \
            --dart-define=ADMOB_INTERSTITIAL_IOS=$ADMOB_INTERSTITIAL_IOS \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
          find build -name "*.ipa" -type f
      - name: Upload to App Store Connect
        script: |
          IPA_PATH=$(find build -name "*.ipa" -type f | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: no .ipa found after build"
            exit 1
          fi
          echo "Uploading $IPA_PATH (Apple ID $APP_STORE_APPLE_ID)..."
          set +e
          app-store-connect publish \
            --path "$IPA_PATH" \
            --apple-id "$APP_STORE_APPLE_ID" \
            --altool-retries 5 \
            --skip-package-validation 2>&1 | tee /tmp/asc_publish.log
          EXIT=$?
          set -e
          if grep -q "UPLOAD SUCCEEDED" /tmp/asc_publish.log; then
            echo "Upload delivered to Apple (build must be new — currently from pubspec.yaml)."
            echo "Check App Store Connect → Distribution → Activité in 15-45 minutes."
            app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || true
            exit 0
          fi
          echo "Upload failed (exit $EXIT)"
          exit "$EXIT"
    artifacts:
      - build/**/*.ipa
    publishing:
      email:
        recipients:
          - contact@w-dynaweb.com
        notify:
          success: true
          failure: true
      # Upload déjà fait dans "Build and upload IPA" — ne pas republier ici

  android-release:
    name: Android Play Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - ringtone_secrets
      vars:
        RC_ENTITLEMENT_ID: pro
        RC_OFFERING_ID: default
        RC_MONTHLY_PRODUCT_ID: ringtone_pro_monthly
        RC_ANNUAL_PRODUCT_ID: ringtone_pro_annual
        RC_LIFETIME_PRODUCT_ID: ringtone_pro_lifetime
        PRIVACY_POLICY_URL: https://chafik83606.github.io/ringtone/privacy.html
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --dart-define=RC_ANDROID_API_KEY=$RC_ANDROID_API_KEY \
            --dart-define=RC_ENTITLEMENT_ID=$RC_ENTITLEMENT_ID \
            --dart-define=RC_OFFERING_ID=$RC_OFFERING_ID \
            --dart-define=RC_MONTHLY_PRODUCT_ID=$RC_MONTHLY_PRODUCT_ID \
            --dart-define=RC_ANNUAL_PRODUCT_ID=$RC_ANNUAL_PRODUCT_ID \
            --dart-define=RC_LIFETIME_PRODUCT_ID=$RC_LIFETIME_PRODUCT_ID \
            --dart-define=ADMOB_BANNER_ANDROID=$ADMOB_BANNER_ANDROID \
            --dart-define=ADMOB_INTERSTITIAL_ANDROID=$ADMOB_INTERSTITIAL_ANDROID \
            --dart-define=PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
